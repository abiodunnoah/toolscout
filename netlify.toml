# Netlify build configuration for this Vite (Vue) site.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any unknown path (needed once
# Vue Router views land in Week 3).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
